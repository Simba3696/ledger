# Hosted edition: Netlify serves the client build and runs the whole API as
# one function (ADR-0004, LLD §7). Environment variables (DATABASE_URL,
# SUPABASE_URL, OWNER_EMAIL, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY,
# APP_TIMEZONE, ENABLED_MODULES) are set in the Netlify site's settings,
# never here. docs/DEPLOY.md step 7 and LLD §9 describe each one.

[build]
  # `npm ci` at the root installs every workspace (client and server) from
  # the lockfile: the client's build tools for this command, and the
  # server's runtime dependencies for the function bundle below.
  command   = "npm ci && npm run build -w client"
  publish   = "client/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  # esbuild resolves the server's `.js` import specifiers to its `.ts`
  # sources and bundles every dependency, so no included_files are needed.
  node_bundler = "esbuild"

# The function sees the original /api/... path through this rewrite;
# createApp mounts the API there as well as at /.netlify/functions/api.
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200

# Client-side routing: any path that isn't a built file gets the app shell.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
